<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản lý Dự án & Công việc</title>
    
    <link rel="manifest" href="./manifest.json">
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { initializeFirestore, collection, getDocs, setDoc, doc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
        import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyArB7TKdMEZe1m8P3KQE9oDsQa3VR28G_M",
            authDomain: "project-management-e6e99.firebaseapp.com",
            projectId: "project-management-e6e99",
            storageBucket: "project-management-e6e99.firebasestorage.app",
            messagingSenderId: "586044974271",
            appId: "1:586044974271:web:df3664fc298ff9a2d1520a",
            measurementId: "G-NY0X9Z771S"
        };

        try {
            const app = initializeApp(firebaseConfig);
            const db = initializeFirestore(app, {}, "default");
            const auth = getAuth(app);
            const provider = new GoogleAuthProvider();

            window.db = db;
            window.auth = auth;
            window.provider = provider;
            window.signInWithPopup = signInWithPopup;
            window.signOut = signOut;
            window.collection = collection;
            window.getDocs = getDocs;
            window.setDoc = setDoc;
            window.doc = doc;
            window.deleteDoc = deleteDoc;

            onAuthStateChanged(auth, (user) => {
                if (user) {
                    window.currentUser = user;
                    document.getElementById('auth-screen').classList.add('hidden');
                    document.getElementById('app-screen').classList.remove('hidden');
                    window.initFirebaseData();
                } else {
                    window.currentUser = null;
                    document.getElementById('auth-screen').classList.remove('hidden');
                    document.getElementById('app-screen').classList.add('hidden');
                }
            });
        } catch (err) {
            console.error("Lỗi khởi tạo Firebase:", err);
        }
    </script>

    <style>
        @media print {
            body { background: white !important; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
            aside, button, input[type="text"], select, textarea { border: none !important; box-shadow: none !important; }
            .no-print { display: none !important; }
        }
        input[type=number]::-webkit-inner-spin-button, 
        input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 font-sans antialiased">

    <div id="auth-screen" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-4">
        <div class="bg-white rounded-3xl shadow-2xl p-8 max-w-md w-full text-center border border-slate-100">
            <div class="w-16 h-16 bg-indigo-50 text-indigo-600 rounded-2xl flex items-center justify-center mx-auto mb-5 text-2xl shadow-inner">
                <i class="fa-solid fa-cloud-arrow-up"></i>
            </div>
            <h1 class="text-2xl font-bold text-slate-900 mb-2">Không Gian Làm Việc Cloud</h1>
            <p class="text-slate-500 text-sm mb-8">Quản lý dự án thông minh tích hợp thông báo di động.</p>
            <button onclick="window.signInWithPopup(window.auth, window.provider)" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-3.5 px-6 rounded-2xl transition shadow-lg shadow-indigo-200 flex items-center justify-center gap-3 cursor-pointer">
                <i class="fa-brands fa-google text-lg"></i> Đăng nhập bằng Google
            </button>
        </div>
    </div>

    <div id="app-screen" class="hidden flex flex-col md:flex-row h-screen overflow-hidden">
        
        <aside class="w-full md:w-80 bg-white border-b md:border-r border-slate-200 flex flex-col justify-between no-print shrink-0 max-h-52 md:max-h-full">
            <div>
                <div class="p-3 md:p-4 border-b border-slate-200 flex items-center justify-between">
                    <div class="flex items-center gap-2 truncate pr-2">
                        <img id="user-avatar" src="" class="w-7 h-7 rounded-full border border-slate-200 object-cover" alt="Avatar">
                        <span id="user-name" class="font-bold text-xs md:text-sm text-slate-800 truncate">User</span>
                    </div>
                    <button onclick="window.signOut(window.auth)" class="text-slate-400 hover:text-red-500 p-1.5 rounded-lg transition cursor-pointer" title="Đăng xuất">
                        <i class="fa-solid fa-right-from-bracket text-sm"></i>
                    </button>
                </div>
                <div class="p-3 border-b border-slate-100 flex items-center justify-between bg-slate-50/50">
                    <h2 class="font-bold text-xs uppercase text-slate-500 tracking-wider">Dự án của tôi</h2>
                    <button onclick="addNewProject()" class="bg-indigo-600 hover:bg-indigo-700 text-white w-7 h-7 rounded-full flex items-center justify-center transition shadow-sm cursor-pointer" title="Thêm dự án mới">
                        <i class="fa-solid fa-plus text-xs"></i>
                    </button>
                </div>
                <div id="project-list" class="p-2 space-y-1 overflow-y-auto max-h-32 md:max-h-[calc(100vh-190px)]">
                    <div class="text-center py-4 text-slate-400 text-xs">Đang tải dữ liệu...</div>
                </div>
            </div>
            <div class="hidden md:flex p-3 border-t border-slate-200 text-[11px] text-indigo-600 font-medium items-center justify-between bg-indigo-50/50">
                <span><i class="fa-solid fa-rotate animate-spin mr-1"></i> Đã đồng bộ Cloud</span>
                <button onclick="requestNotificationPermission()" class="bg-indigo-600 text-white px-2.5 py-1 rounded-lg hover:bg-indigo-700 transition cursor-pointer shadow-sm">Bật thông báo 🔔</button>
            </div>
        </aside>

        <main class="flex-1 flex flex-col h-full overflow-y-auto bg-slate-50" id="main-content">
            <div class="flex-1 flex items-center justify-center text-slate-400 p-6 text-center">
                <p>Đang tải dữ liệu dự án...</p>
            </div>
        </main>

    </div>

    <script>
        // Đăng ký Service Worker để bật thông báo và hỗ trợ PWA
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js')
                    .then((reg) => console.log('Service Worker đăng ký thành công:', reg.scope))
                    .catch((err) => console.log('Đăng ký Service Worker thất bại:', err));
            });
        }

        let projects = [];
        let currentProjectId = null;
        let currentTab = 'tasks';
        let taskViewMode = 'table'; // 'table' hoặc 'kanban'
        
        // Bộ lọc nâng cao
        let filterKeyword = '';
        let filterAssignee = 'all';
        let filterUrgency = 'all';
        let filterDeadline = '';

        // Sổ địa chỉ ánh xạ tên gọi với email (Lưu trữ cục bộ localStorage)
        let memberRegistry = JSON.parse(localStorage.getItem('hspinky_member_registry')) || {};

        function getEmailByNameOrInput(inputStr) {
            let clean = inputStr.trim().toLowerCase();
            for (let [name, email] of Object.entries(memberRegistry)) {
                if (name.toLowerCase() === clean) return email;
            }
            return inputStr; // Nếu không có trong danh bạ thì giữ nguyên giả sử đó là email
        }

        function getNameByEmail(emailStr) {
            if (!emailStr) return '';
            let clean = emailStr.trim().toLowerCase();
            for (let [name, email] of Object.entries(memberRegistry)) {
                if (email.toLowerCase() === clean) return name;
            }
            return emailStr; // Mặc định trả về email nếu chưa đặt tên
        }

        function saveMemberRegistry() {
            localStorage.setItem('hspinky_member_registry', JSON.stringify(memberRegistry));
        }

        function promptManageMembers() {
            let info = "DANH BẠ TÊN & EMAIL THÀNH VIÊN:\n";
            for (let [name, email] of Object.entries(memberRegistry)) {
                info += `- ${name}: ${email}\n`;
            }
            info += "\nNhập TÊN mới theo định dạng: Tên | email@gmail.com";
            let input = prompt(info);
            if (input && input.includes('|')) {
                let parts = input.split('|');
                let name = parts[0].trim();
                let email = parts[1].trim().toLowerCase();
                if (name && email) {
                    memberRegistry[name] = email;
                    saveMemberRegistry();
                    alert(`Đã lưu thành công: ${name} -> ${email}`);
                    renderMainContent();
                }
            }
        }

        async function requestNotificationPermission() {
            if ("Notification" in window) {
                const permission = await Notification.requestPermission();
                if (permission === "granted") {
                    new Notification("Đã kích hoạt thông báo!", { body: "Bạn sẽ nhận được cảnh báo khi có công việc đến hạn." });
                    checkTaskDeadlines();
                } else {
                    alert("Trình duyệt của bạn không hỗ trợ thông báo trên trình duyệt.");
                }
            } else {
                alert("Trình duyệt không hỗ trợ.");
            }
        }

        function updateAppBadge(count) {
            if ('setAppBadge' in navigator) {
                try {
                    if (count > 0) navigator.setAppBadge(count);
                    else navigator.clearAppBadge();
                } catch (e) {}
            }
        }

        function getTodayDisplay() {
            const d = new Date();
            return `${String(d.getDate()).padStart(2, '0')}/${String(d.getMonth() + 1).padStart(2, '0')}/${d.getFullYear()}`;
        }

        function checkTaskDeadlines() {
            const todayStr = getTodayDisplay();
            let dueCount = 0;
            let dueDetails = [];

            projects.forEach(proj => {
                if (proj.tasks) {
                    proj.tasks.forEach(task => {
                        const st = task.status || 'Ver 1';
                        if (st === 'Final' || st === 'Chờ phản hồi') return;

                        if (task.deadline === todayStr) {
                            dueCount++;
                            dueDetails.push(`• [${proj.name}] ${task.name}`);
                        }
                    });
                }
            });

            if (dueCount > 0) {
                document.title = `(${dueCount}) 🔔 Có Deadline Hôm Nay!`;
                updateAppBadge(dueCount);

                if ("vibrate" in navigator) {
                    try { navigator.vibrate([200, 100, 200]); } catch (e) {}
                }

                if ("Notification" in window && Notification.permission === "granted") {
                    const key = "notified_" + todayStr;
                    if (!sessionStorage.getItem(key)) {
                        if (navigator.serviceWorker && navigator.serviceWorker.controller) {
                            navigator.serviceWorker.ready.then(registration => {
                                registration.showNotification(`⏰ Có ${dueCount} công việc đến hạn hôm nay!`, {
                                    body: dueDetails.join("\n"),
                                    icon: "./playstore.png",
                                    badge: "./playstore.png",
                                    tag: "deadline-notification",
                                    requireInteraction: true
                                });
                            });
                        } else {
                            new Notification(`⏰ Có ${dueCount} công việc đến hạn hôm nay!`, {
                                body: dueDetails.join("\n"),
                                icon: "./playstore.png",
                                badge: "./playstore.png",
                                tag: "deadline-notification",
                                requireInteraction: true
                            });
                        }
                        sessionStorage.setItem(key, "true");
                    }
                }
            } else {
                document.title = `Quản lý Dự án & Công việc`;
                updateAppBadge(0);
            }
        }

        window.initFirebaseData = async function() {
            if (!window.currentUser) return;
            
            document.getElementById('user-avatar').src = window.currentUser.photoURL || 'https://via.placeholder.com/150';
            document.getElementById('user-name').innerText = window.currentUser.displayName || window.currentUser.email;

            try {
                const userEmail = window.currentUser.email.trim().toLowerCase();
                const querySnapshot = await window.getDocs(window.collection(window.db, "projects"));
                
                projects = [];
                querySnapshot.forEach((docSnap) => {
                    const data = docSnap.data();
                    const owner = (data.ownerEmail || '').trim().toLowerCase();
                    const shared = (data.sharedEmails || []).map(e => e.trim().toLowerCase());
                    
                    if (owner === userEmail || shared.includes(userEmail)) {
                        projects.push({ id: docSnap.id, ...data });
                    }
                });

                currentProjectId = projects.length > 0 ? projects[0].id : null;
                renderApp();
            } catch (error) {
                console.error("Lỗi tải Firebase:", error);
            }
        };

        async function saveData() {
            const proj = projects.find(p => p.id === currentProjectId);
            if (proj) {
                try {
                    await window.setDoc(window.doc(window.db, "projects", String(proj.id)), proj);
                    checkTaskDeadlines();
                } catch (error) {
                    console.error("Lỗi lưu dữ liệu:", error);
                }
            }
        }

        async function addNewProject() {
            const newProj = {
                id: "proj_" + Date.now(),
                name: 'Dự án mới',
                ownerEmail: window.currentUser.email.trim().toLowerCase(),
                sharedEmails: [],
                members: 'Thành viên nhóm',
                startDate: getTodayDisplay(),
                deadline: '31/12/2026',
                tasks: []
            };
            projects.push(newProj);
            currentProjectId = newProj.id;
            await saveData();
            renderApp();
        }

        async function updateProjectInfo(field, value) {
            const proj = projects.find(p => p.id === currentProjectId);
            if (proj) {
                proj[field] = value;
                await saveData();
                renderProjectList();
                renderMainContent();
            }
        }

        async function updateSharedEmails(value) {
            const proj = projects.find(p => p.id === currentProjectId);
            if (proj) {
                let rawList = value.split(',').map(e => e.trim()).filter(e => e !== '');
                proj.sharedEmails = rawList.map(item => getEmailByNameOrInput(item));
                await saveData();
            }
        }

        async function deleteProject(id, event) {
            event.stopPropagation();
            const proj = projects.find(p => p.id === id);
            const userEmail = window.currentUser.email.trim().toLowerCase();
            if (proj && proj.ownerEmail && proj.ownerEmail !== userEmail) {
                alert("Bạn chỉ có quyền xóa dự án do chính tài khoản của bạn tạo ra!");
                return;
            }
            if(confirm('Bạn có chắc muốn xóa dự án này trên Cloud?')) {
                try {
                    await window.deleteDoc(window.doc(window.db, "projects", String(id)));
                    projects = projects.filter(p => p.id !== id);
                    currentProjectId = projects.length > 0 ? projects[0].id : null;
                    renderApp();
                } catch (error) {
                    console.error("Lỗi xóa dự án:", error);
                }
            }
        }

        function switchTab(tabName) {
            currentTab = tabName;
            renderMainContent();
        }

        async function addNewTask() {
            const proj = projects.find(p => p.id === currentProjectId);
            if (!proj) return;

            const today = getTodayDisplay();
            if (!proj.tasks) proj.tasks = [];
            
            proj.tasks.push({
                id: Date.now(),
                name: 'Công việc mới',
                assignee: 'Chưa phân công',
                startDate: today,
                deadline: today,
                urgency: 'Thấp',
                status: 'Ver 1',
                progressNote: '',
                cost: 0,
                links: [],
                issue: '',
                solution: ''
            });
            await saveData();
            renderMainContent();
        }

        async function updateTask(taskId, field, value) {
            const proj = projects.find(p => p.id === currentProjectId);
            if (!proj) return;
            const task = proj.tasks.find(t => t.id === taskId);
            if (task) {
                if (field === 'assignee') {
                    task[field] = getEmailByNameOrInput(value); // Hỗ trợ gõ tên tự đổi thành email trong DB
                } else if (field === 'cost') {
                    task[field] = parseFloat(value) || 0;
                } else {
                    task[field] = value;
                }
                await saveData();
                renderMainContent();
            }
        }

        function handleDateInput(el, nextId, prevId) {
            let val = el.value.replace(/\D/g, '');
            let maxLen = parseInt(el.getAttribute('maxlength')) || 2;
            if (val.length > maxLen) val = val.slice(0, maxLen);
            el.value = val;
            if (val.length === maxLen && nextId) document.getElementById(nextId)?.focus();
            triggerAssembleDate(el);
        }

        function handleDateKeydown(e, prevId) {
            if (e.key === 'Backspace' && e.target.value.length === 0 && prevId) document.getElementById(prevId)?.focus();
        }

        function triggerAssembleDate(el) {
            const container = el.closest('.date-picker-group');
            if (!container) return;
            const d = container.querySelector('.d-input').value.padStart(2, '0');
            const m = container.querySelector('.m-input').value.padStart(2, '0');
            const y = container.querySelector('.y-input').value;
            const hiddenTarget = container.querySelector('.hidden-target');

            if (d.length === 2 && m.length === 2 && y.length === 4) {
                let fullDate = `${d}/${m}/${y}`;
                if (hiddenTarget.value !== fullDate) {
                    hiddenTarget.value = fullDate;
                    hiddenTarget.dispatchEvent(new Event('change'));
                }
            }
        }

        async function deleteTask(taskId) {
            const proj = projects.find(p => p.id === currentProjectId);
            if (!proj) return;
            proj.tasks = proj.tasks.filter(t => t.id !== taskId);
            await saveData();
            renderMainContent();
        }

        async function addLinkToTask(taskId) {
            const proj = projects.find(p => p.id === currentProjectId);
            if (!proj) return;
            const task = proj.tasks.find(t => t.id === taskId);
            if (task) {
                if (!task.links) task.links = [];
                const title = prompt("Nhập tên hiển thị cho tài liệu/link:");
                if (!title || title.trim() === '') return;
                const url = prompt("Nhập đường dẫn (URL) của tài liệu/link:");
                if (url && url.trim() !== '') {
                    task.links.push({ id: Date.now(), title: title.trim(), url: url.trim() });
                    await saveData();
                    renderMainContent();
                }
            }
        }

        async function removeLinkFromTask(taskId, linkId) {
            const proj = projects.find(p => p.id === currentProjectId);
            if (!proj) return;
            const task = proj.tasks.find(t => t.id === taskId);
            if (task && task.links) {
                task.links = task.links.filter(l => l.id !== linkId);
                await saveData();
                renderMainContent();
            }
        }

        function exportProjectReport() { window.print(); }

        function renderCustomDateInput(dateStr, onChangeJsCode, uniquePrefix) {
            let parts = (dateStr || '').split('/');
            let d = parts[0] || '';
            let m = parts[1] || '';
            let y = parts[2] || '';

            return `
                <div class="date-picker-group inline-flex items-center bg-slate-50 border border-slate-200 rounded-lg px-2 py-1 shadow-sm">
                    <input type="text" value="${d}" placeholder="DD" maxlength="2" inputmode="numeric"
                        oninput="handleDateInput(this, 'm_${uniquePrefix}', null)" onkeydown="handleDateKeydown(event, null)"
                        class="d-input w-6 text-center bg-transparent focus:outline-none text-xs md:text-sm font-semibold text-slate-800">
                    <span class="text-slate-400 font-bold px-0.5">/</span>
                    <input type="text" value="${m}" placeholder="MM" maxlength="2" inputmode="numeric"
                        oninput="handleDateInput(this, 'y_${uniquePrefix}', 'd_${uniquePrefix}')" onkeydown="handleDateKeydown(event, 'd_${uniquePrefix}')"
                        class="m-input w-6 text-center bg-transparent focus:outline-none text-xs md:text-sm font-semibold text-slate-800">
                    <span class="text-slate-400 font-bold px-0.5">/</span>
                    <input type="text" value="${y}" placeholder="YYYY" maxlength="4" inputmode="numeric"
                        oninput="handleDateInput(this, null, 'm_${uniquePrefix}')" onkeydown="handleDateKeydown(event, 'm_${uniquePrefix}')"
                        class="y-input w-10 text-center bg-transparent focus:outline-none text-xs md:text-sm font-semibold text-slate-800">
                    
                    <input type="text" class="hidden-target hidden" value="${dateStr || ''}" onchange="${onChangeJsCode}">
                    
                    <div class="relative ml-1.5 pl-1.5 border-l border-slate-200">
                        <input type="date" onchange="const p = this.parentElement.parentElement; const t = p.querySelector('.hidden-target'); t.value = yyyyMmDdToDdMmYyyy(this.value); t.dispatchEvent(new Event('change'));" 
                            title="Bấm để chọn lịch" class="absolute opacity-0 w-full h-full cursor-pointer inset-0">
                        <i class="fa-regular fa-calendar text-indigo-600 text-xs"></i>
                    </div>
                </div>
            `;
        }

        function yyyyMmDdToDdMmYyyy(dateStr) {
            if (!dateStr) return '';
            if (dateStr.includes('-')) {
                const parts = dateStr.split('-');
                if (parts[0].length === 4) return `${parts[2]}/${parts[1]}/${parts[0]}`;
            }
            return dateStr;
        }

        function renderProjectList() {
            const listEl = document.getElementById('project-list');
            listEl.innerHTML = '';

            if (!projects || projects.length === 0) {
                listEl.innerHTML = `<div class="text-center py-6 text-slate-400 text-xs px-2">Chưa có dự án nào. Bấm nút <b>+</b> phía trên để tạo mới.</div>`;
                return;
            }

            const todayStr = getTodayDisplay();
            const userEmail = window.currentUser.email.trim().toLowerCase();

            projects.forEach(proj => {
                const isActive = proj.id === currentProjectId;
                let projDueCount = 0;
                if (proj.tasks) {
                    proj.tasks.forEach(t => { 
                        const st = t.status || 'Ver 1';
                        if (t.deadline === todayStr && st !== 'Final' && st !== 'Chờ phản hồi') projDueCount++; 
                    });
                }

                const badgeHtml = projDueCount > 0 ? `<span class="bg-red-500 text-white text-[9px] font-bold px-1.5 py-0.2 rounded-full ml-1 animate-bounce">${projDueCount}</span>` : '';
                const isShared = proj.ownerEmail && proj.ownerEmail !== userEmail ? `<i class="fa-solid fa-users text-[10px] text-indigo-500 ml-1" title="Dự án được chia sẻ với bạn"></i>` : '';

                const item = document.createElement('div');
                item.className = `group flex items-center justify-between p-2.5 md:p-3 rounded-xl cursor-pointer transition ${isActive ? 'bg-indigo-50 text-indigo-900 font-semibold shadow-sm' : 'hover:bg-slate-100 text-slate-600'}`;
                item.onclick = () => { currentProjectId = proj.id; renderApp(); };

                item.innerHTML = `
                    <div class="truncate flex-1 pr-2">
                        <div class="text-xs md:text-sm font-medium truncate flex items-center">
                            ${proj.name} ${isShared} ${badgeHtml}
                        </div>
                        <div class="text-[10px] md:text-[11px] text-slate-400 flex items-center gap-1 mt-0.5">
                            <i class="fa-regular fa-clock text-[9px]"></i> ĐT: ${proj.deadline || 'Chưa có'}
                        </div>
                    </div>
                    <button onclick="deleteProject('${proj.id}', event)" class="opacity-0 group-hover:opacity-100 text-slate-400 hover:text-red-500 p-1 transition cursor-pointer" title="Xóa dự án">

                    </button>
                `;
                listEl.appendChild(item);
            });
        }

        // Xử lý Gợi ý Tên / Dự án (Autocomplete Suggestions)
        function showSuggestions(inputEl, type) {
            let val = inputEl.value.trim().toLowerCase();
            let parent = inputEl.parentElement;
            let existingBox = parent.querySelector('.suggestion-box');
            if (existingBox) existingBox.remove();

            if (val.length === 0) return;

            let matches = [];
            if (type === 'assignee') {
                let uniqueNames = new Set();
                for (let name of Object.keys(memberRegistry)) uniqueNames.add(name);
                projects.forEach(p => {
                    if (p.tasks) p.tasks.forEach(t => {
                        if (t.assignee) uniqueNames.add(getNameByEmail(t.assignee));
                    });
                });
                matches = Array.from(uniqueNames).filter(n => n.toLowerCase().includes(val));
            } else if (type === 'project') {
                matches = projects.filter(p => p.name.toLowerCase().includes(val)).map(p => p.name);
            }

            if (matches.length === 0) return;

            let box = document.createElement('div');
            box.className = "suggestion-box absolute left-0 right-0 top-full mt-1 bg-white border border-slate-200 rounded-xl shadow-lg z-50 max-h-40 overflow-y-auto";
            
            matches.forEach(m => {
                let item = document.createElement('div');
                item.className = "px-3 py-2 text-xs hover:bg-indigo-50 cursor-pointer text-slate-700 font-medium";
                item.innerText = m;
                item.onmousedown = () => {
                    inputEl.value = m;
                    inputEl.dispatchEvent(new Event('input'));
                    box.remove();
                };
                box.appendChild(item);
            });

            parent.style.position = 'relative';
            parent.appendChild(box);
        }

            const mainEl = document.getElementById('main-content');
            const proj = projects.find(p => p.id === currentProjectId);

                mainEl.innerHTML = `<div class="flex-1 flex flex-col items-center justify-center text-slate-400 p-6 text-center"><i class="fa-solid fa-folder-open text-4xl mb-3"></i><p class="text-sm">Chưa có dự án nào. Bấm nút dấu cộng ở menu bên trái để tạo dự án mới.</p></div>`;

                        </div>
                        <div class="flex items-center gap-2 mt-4 border-b border-slate-100 pb-2 overflow-x-auto">
                            <button onclick="switchTab('tasks')" class="px-3.5 py-2 rounded-xl text-xs md:text-sm font-semibold transition cursor-pointer whitespace-nowrap ${currentTab === 'tasks' ? 'bg-indigo-600 text-white shadow-sm' : 'text-slate-600 hover:bg-slate-100'}"><i class="fa-solid fa-list-check mr-1.5"></i> Công việc</button>
                            <button onclick="switchTab('gantt')" class="px-3.5 py-2 rounded-xl text-xs md:text-sm font-semibold transition cursor-pointer whitespace-nowrap ${currentTab === 'gantt' ? 'bg-indigo-600 text-white shadow-sm' : 'text-slate-600 hover:text-indigo-600'}"><i class="fa-solid fa-chart-gantt mr-1.5"></i> Gantt Chart</button>
                            <button onclick="switchTab('costs')" class="px-3.5 py-2 rounded-xl text-xs md:text-sm font-semibold transition cursor-pointer whitespace-nowrap ${currentTab === 'costs' ? 'bg-indigo-600 text-white shadow-sm' : 'text-slate-600 hover:text-slate-100'}"><i class="fa-solid fa-wallet mr-1.5"></i> Chi phí</button>
                            <button onclick="switchTab('risks')" class="px-3.5 py-2 rounded-xl text-xs md:text-sm font-semibold transition cursor-pointer whitespace-nowrap ${currentTab === 'risks' ? 'bg-indigo-600 text-white shadow-sm' : 'text-slate-600 hover:text-slate-100'}"><i class="fa-solid fa-triangle-exclamation mr-1.5"></i> Rủi ro</button>
                        </div>
                    </div>
                </div>
                <div class="p-4 md:p-6 max-w-7xl mx-auto w-full flex-1">${tabContentHtml}</div>
            `;
        }

        function renderApp() {
            renderProjectList();
            renderMainContent();
            checkTaskDeadlines();
        }
    </script>
</body>
