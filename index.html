<html lang="vi">
<head>
    <meta charset="UTF-8">

    <title>Quản lý Dự án & Công việc</title>
    
    <link rel="manifest" href="./manifest.json">
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { initializeFirestore, collection, getDocs, setDoc, doc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
        import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyArB7TKdMEZe1m8P3KQE9oDsQa3VR28G_M",
            authDomain: "project-management-e6e99.firebaseapp.com",
            projectId: "project-management-e6e99",
            storageBucket: "project-management-e6e99.firebasestorage.app",
            messagingSenderId: "586044974271",
            appId: "1:586044974271:web:df3664fc298ff9a2d1520a",
            measurementId: "G-NY0X9Z771S"
        };

        try {
            const app = initializeApp(firebaseConfig);
            const db = initializeFirestore(app, {}, "default");
            const auth = getAuth(app);
            const provider = new GoogleAuthProvider();

            window.db = db;
            window.auth = auth;
            window.provider = provider;
            window.signInWithPopup = signInWithPopup;
            window.signOut = signOut;
            window.collection = collection;
            window.getDocs = getDocs;
            window.setDoc = setDoc;
            window.doc = doc;
            window.deleteDoc = deleteDoc;

            onAuthStateChanged(auth, (user) => {
                if (user) {
                    window.currentUser = user;
                    document.getElementById('auth-screen').classList.add('hidden');
                    document.getElementById('app-screen').classList.remove('hidden');
                    window.initFirebaseData();
                } else {
                    window.currentUser = null;
                    document.getElementById('auth-screen').classList.remove('hidden');
                    document.getElementById('app-screen').classList.add('hidden');
                }
            });
        } catch (err) {
            console.error("Lỗi khởi tạo Firebase:", err);
        }
    </script>

    <style>
        @media print {
            body { background: white !important; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
            aside, button, input[type="text"], select, textarea { border: none !important; box-shadow: none !important; }
            .no-print { display: none !important; }

        input[type=number]::-webkit-inner-spin-button, 
        input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }

</head>
<body class="bg-slate-50 text-slate-800 font-sans antialiased relative">

    <div id="custom-modal" class="fixed inset-0 bg-slate-900/40 backdrop-blur-xs z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-white rounded-2xl shadow-xl max-w-md w-full p-6 border border-slate-100 text-center animate-in fade-in zoom-in duration-200">
            <div id="modal-icon-container" class="w-12 h-12 bg-indigo-50 text-indigo-600 rounded-xl flex items-center justify-center mx-auto mb-4 text-xl">
                <i id="modal-icon" class="fa-solid fa-bell"></i>
            </div>
            <h3 id="modal-title" class="font-bold text-slate-900 text-base mb-2">Thông báo</h3>
            <div id="modal-message" class="text-xs text-slate-600 mb-6 leading-relaxed text-left">Nội dung thông báo...</div>
            <div id="modal-actions" class="flex gap-2 justify-center">
                <button onclick="closeCustomModal()" class="bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-semibold px-4 py-2.5 rounded-xl transition w-full cursor-pointer">Đã hiểu</button>
            </div>
        </div>
    </div>

    <div id="auth-screen" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-4">
        <div class="bg-white rounded-3xl shadow-2xl p-8 max-w-md w-full text-center border border-slate-100">
            <div class="w-16 h-16 bg-indigo-50 text-indigo-600 rounded-2xl flex items-center justify-center mx-auto mb-5 text-2xl shadow-inner">
                <i class="fa-solid fa-cloud-arrow-up"></i>
            </div>
            <h1 class="text-2xl font-bold text-slate-900 mb-2">Không Gian Làm Việc Cloud</h1>
            <p class="text-slate-500 text-sm mb-8">Quản lý dự án thông minh tích hợp thông báo di động.</p>
            <button onclick="window.signInWithPopup(window.auth, window.provider)" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-3.5 px-6 rounded-2xl transition shadow-lg shadow-indigo-200 flex items-center justify-center gap-3 cursor-pointer">
                <i class="fa-brands fa-google text-lg"></i> Đăng nhập bằng Google

            <div>
                <div class="p-3 md:p-4 border-b border-slate-200 flex items-center justify-between">
                    <div class="flex items-center gap-2 truncate pr-2">

                        <span id="user-name" class="font-bold text-xs md:text-sm text-slate-800 truncate">User</span>

                    <button onclick="window.signOut(window.auth)" class="text-slate-400 hover:text-red-500 p-1.5 rounded-lg transition cursor-pointer" title="Đăng xuất">

                    </button>
                </div>
                <div class="p-3 border-b border-slate-100 flex items-center justify-between bg-slate-50/50">
                    <h2 class="font-bold text-xs uppercase text-slate-500 tracking-wider">Dự án của tôi</h2>
                    <button onclick="addNewProject()" class="bg-indigo-600 hover:bg-indigo-700 text-white w-7 h-7 rounded-full flex items-center justify-center transition shadow-sm cursor-pointer" title="Thêm dự án mới">

                </div>
            </div>
            <div class="hidden md:flex p-3 border-t border-slate-200 text-[11px] text-indigo-600 font-medium items-center justify-between bg-indigo-50/50">
                <span><i class="fa-solid fa-rotate animate-spin mr-1"></i> Đã đồng bộ Cloud</span>
                <button onclick="requestNotificationPermission()" class="bg-indigo-600 text-white px-2.5 py-1 rounded-lg hover:bg-indigo-700 transition cursor-pointer shadow-sm">Bật thông báo 🔔</button>

        <main class="flex-1 flex flex-col h-full overflow-y-auto bg-slate-50" id="main-content">
            <div class="flex-1 flex items-center justify-center text-slate-400 p-6 text-center">
                <p>Đang tải dữ liệu dự án...</p>
            </div>

    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js')
                    .then((reg) => console.log('Service Worker đăng ký thành công:', reg.scope))
                    .catch((err) => console.log('Đăng ký Service Worker thất bại:', err));
            });
        }

        let projects = [];
        let currentProjectId = null;
        let currentTab = 'tasks';
        let taskViewMode = 'table';
        
        let filterKeyword = '';
        let filterUrgency = 'all';
        let filterDeadline = '';
        let memberSearchKeyword = '';

        let memberRegistry = JSON.parse(localStorage.getItem('hspinky_member_registry_v6')) || {};

        function showCustomModal(title, htmlContent, iconClass = 'fa-bell', customActions = null) {
            document.getElementById('modal-title').innerText = title;
            document.getElementById('modal-message').innerHTML = htmlContent;
            document.getElementById('modal-icon').className = `fa-solid ${iconClass}`;
            
            const actionsEl = document.getElementById('modal-actions');
            if (customActions) {
                actionsEl.innerHTML = customActions;
            } else {
                actionsEl.innerHTML = `<button onclick="closeCustomModal()" class="bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-semibold px-4 py-2.5 rounded-xl transition w-full cursor-pointer">Đã hiểu</button>`;
            }
            document.getElementById('custom-modal').classList.remove('hidden');
        }

        function closeCustomModal() {
            document.getElementById('custom-modal').classList.add('hidden');
        }

        function parseMemberInput(inputStr) {
            if (!inputStr) return { name: '', email: '' };
            let raw = inputStr.trim();
            let match = raw.match(/^(.*?)\s*\((.*?)\)$/);
            if (match) {
                return { name: match[1].trim(), email: match[2].trim().toLowerCase() };
            }
            if (raw.includes('@')) {
                let parts = raw.split('@');
                return { name: parts[0].trim(), email: raw.toLowerCase() };
            }
            return { name: raw, email: '' };
        }

        function getEmailByNameOrInput(inputStr) {
            if (!inputStr) return '';
            let parsed = parseMemberInput(inputStr);
            let cleanName = parsed.name.toLowerCase();
            if (parsed.email) return parsed.email;

            for (let [name, data] of Object.entries(memberRegistry)) {
                if (name.toLowerCase() === cleanName) return data.email;
            }

            if (window.currentUser && window.currentUser.email) {
                let currentEmail = window.currentUser.email.trim().toLowerCase();
                let usernamePart = currentEmail.split('@')[0];
                if (cleanName === usernamePart || cleanName === 'tôi' || cleanName === 'me') {
                    return currentEmail;
                }
            }
            return inputStr.trim().toLowerCase();
        }

        function getNameByEmail(emailStr) {
            if (!emailStr) return '';
            let clean = emailStr.trim().toLowerCase();
            for (let [name, data] of Object.entries(memberRegistry)) {
                if (data.email.toLowerCase() === clean) return name;
            }
            if (window.currentUser && window.currentUser.email) {
                if (clean === window.currentUser.email.trim().toLowerCase()) {
                    return window.currentUser.displayName || clean.split('@')[0];
                }
            }
            return emailStr;
        }

        function getUserProjectRole(proj) {
            if (!window.currentUser) return 'viewer';
            const userEmail = window.currentUser.email.trim().toLowerCase();
            const owner = (proj.ownerEmail || '').trim().toLowerCase();
            
            if (owner === userEmail) return 'owner';

            if (proj.members) {
                let items = proj.members.split(',').map(m => m.trim());
                for (let item of items) {
                    let parsed = parseMemberInput(item);
                    let emailMapped = parsed.email || getEmailByNameOrInput(parsed.name);
                    
                    if (emailMapped === userEmail) {
                        let cleanName = parsed.name.toLowerCase();
                        for (let [regName, regData] of Object.entries(memberRegistry)) {
                            if (regName.toLowerCase() === cleanName && regData.role === 'chinhsua') {
                                return 'editor';
                            }
                        }
                    }
                }
            }
            return 'viewer';
        }

        function saveMemberRegistry() {
            localStorage.setItem('hspinky_member_registry_v6', JSON.stringify(memberRegistry));
        }

        function logActivity(proj, actionText) {
            if (!proj.activities) proj.activities = [];
            const d = new Date();
            const timeStr = `${String(d.getDate()).padStart(2, '0')}/${String(d.getMonth() + 1).padStart(2, '0')}/${d.getFullYear()} ${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`;
            const userName = window.currentUser.displayName || window.currentUser.email.split('@')[0];
            
            proj.activities.unshift({
                id: Date.now(),
                time: timeStr,
                user: userName,
                content: actionText
            });
            if (proj.activities.length > 50) proj.activities.pop();
        }

        function addNewMemberFromPrompt() {
            let actions = `
                <div class="w-full space-y-3">
                    <textarea id="batch-member-input" rows="3" placeholder="Nhập theo cú pháp: Tên (email)&#10;Ví dụ: Hoàng (prodoggy2@gmail.com)" class="w-full text-xs p-3 border border-slate-200 rounded-xl focus:outline-none focus:border-indigo-600 bg-slate-50"></textarea>
                    <div class="flex gap-2">
                        <button onclick="submitBatchMembers()" class="flex-1 bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-semibold py-2.5 rounded-xl transition cursor-pointer">Thêm vào danh bạ</button>
                        <button onclick="closeCustomModal()" class="flex-1 bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-semibold py-2.5 rounded-xl transition cursor-pointer">Hủy</button>
                    </div>
                </div>
            `;
            showCustomModal("Thêm Thành Viên & Email", "Bạn có thể nhập danh sách thành viên mới theo định dạng Tên (email):", "fa-user-plus", actions);
        }

        function submitBatchMembers() {
            const inputVal = document.getElementById('batch-member-input').value;
            if (!inputVal || !inputVal.trim()) return;

            let lines = inputVal.split(/,|\n/);
            let addedCount = 0;

            lines.forEach(line => {
                let cleaned = line.trim();
                if (!cleaned) return;
                let parsed = parseMemberInput(cleaned);
                if (parsed.name && parsed.email) {
                    memberRegistry[parsed.name] = { email: parsed.email, role: 'xem' };
                    addedCount++;
                }
            });

            closeCustomModal();
            if (addedCount > 0) {
                saveMemberRegistry();
                showCustomModal("Thành công", `Đã thêm thành công ${addedCount} thành viên vào sổ danh bạ!`, "fa-circle-check");
                renderMainContent();
            } else {
                showCustomModal("Lỗi cú pháp", "Vui lòng nhập đúng định dạng: Tên (email)", "fa-triangle-exclamation");
            }
        }

        function updateRegistryMemberRole(nameKey, newRole) {
            if (memberRegistry[nameKey]) {
                memberRegistry[nameKey].role = newRole;
                saveMemberRegistry();
                renderMainContent();
            }
        }

        function deleteMemberRegistry(nameKey) {
            let actions = `
                <div class="flex gap-2 w-full">
                    <button onclick="confirmDeleteMember('${nameKey}')" class="flex-1 bg-red-600 hover:bg-red-700 text-white text-xs font-semibold py-2.5 rounded-xl transition cursor-pointer">Xóa</button>
                    <button onclick="closeCustomModal()" class="flex-1 bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-semibold py-2.5 rounded-xl transition cursor-pointer">Hủy</button>
                </div>
            `;
            showCustomModal("Xác nhận xóa", `Bạn có chắc muốn xóa thành viên "${nameKey}" khỏi sổ danh bạ?`, "fa-trash-can", actions);
        }

        function confirmDeleteMember(nameKey) {
            delete memberRegistry[nameKey];
            saveMemberRegistry();
            closeCustomModal();
            renderMainContent();
        }

        function handleViewerAttemptEdit() {
            let actions = `
                <div class="w-full space-y-3">
                    <input type="text" id="request-reason" placeholder="Nhập lý do xin chỉnh sửa (Ví dụ: Cập nhật lại tiến độ công việc...)" class="w-full text-xs p-3 border border-slate-200 rounded-xl focus:outline-none focus:border-indigo-600 bg-slate-50">
                    <div class="flex gap-2">
                        <button onclick="submitPermissionRequest()" class="flex-1 bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-semibold py-2.5 rounded-xl transition cursor-pointer">Gửi yêu cầu</button>
                        <button onclick="closeCustomModal()" class="flex-1 bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-semibold py-2.5 rounded-xl transition cursor-pointer">Đóng</button>
                    </div>
                </div>
            `;
            showCustomModal("Yêu cầu cấp quyền chỉnh sửa", "Bạn đang có quyền 'Xem'. Hãy gửi yêu cầu kèm lý do đến Chủ dự án:", "fa-lock", actions);
        }

        async function submitPermissionRequest() {
            const reasonInput = document.getElementById('request-reason');
            const reason = reasonInput ? reasonInput.value || "Cần chỉnh sửa nội dung dự án" : "Cần chỉnh sửa nội dung dự án";
            const proj = projects.find(p => p.id === currentProjectId);
            if (proj) {
                if (!proj.requests) proj.requests = [];
                const d = new Date();
                const timeStr = `${String(d.getDate()).padStart(2, '0')}/${String(d.getMonth() + 1).padStart(2, '0')}/${d.getFullYear()} ${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`;
                const userName = window.currentUser.displayName || window.currentUser.email.split('@')[0];

                proj.requests.unshift({
                    id: Date.now(),
                    time: timeStr,
                    user: userName,
                    reason: reason
                });

                logActivity(proj, `Gửi yêu cầu cấp quyền chỉnh sửa: "${reason}"`);
                await saveData();
                closeCustomModal();
                showCustomModal("Đã gửi yêu cầu", "Yêu cầu cấp quyền của bạn đã được chuyển đến Chủ dự án thành công!", "fa-paper-plane");
                renderMainContent();
            }
        }

        function openActivityLogModal() {
            const proj = projects.find(p => p.id === currentProjectId);
            if (!proj) return;

            let activitiesHtml = '';
            if (!proj.activities || proj.activities.length === 0) {
                activitiesHtml = `<div class="text-center py-6 text-slate-400 text-xs italic">Chưa có hoạt động nào được ghi nhận.</div>`;
            } else {
                proj.activities.forEach(act => {
                    activitiesHtml += `
                        <div class="flex items-start gap-2.5 p-2.5 rounded-xl hover:bg-slate-50 transition border-b border-slate-100 text-xs">
                            <div class="w-7 h-7 rounded-full bg-indigo-50 text-indigo-600 flex items-center justify-center shrink-0 font-bold text-[10px] mt-0.5">
                                ${act.user.charAt(0).toUpperCase()}
                            </div>
                            <div class="flex-1">
                                <div class="flex items-center justify-between">
                                    <span class="font-bold text-slate-800">${act.user}</span>
                                    <span class="text-[10px] text-slate-400"><i class="fa-regular fa-clock mr-1"></i>${act.time}</span>
                                </div>
                                <p class="text-slate-600 mt-0.5">${act.content}</p>
                            </div>
                        </div>
                    `;
                });
            }

            let requestsHtml = '';
            if (proj.requests && proj.requests.length > 0) {
                proj.requests.forEach(req => {
                    requestsHtml += `
                        <div class="bg-amber-50/70 border border-amber-200 p-3 rounded-xl mb-2 text-xs flex items-center justify-between gap-2">
                            <div>
                                <span class="font-bold text-amber-900">${req.user}</span> xin cấp quyền chỉnh sửa lúc ${req.time}:
                                <p class="text-amber-800 italic mt-0.5">"${req.reason}"</p>
                            </div>
                            <button onclick="approveRequest(${req.id})" class="bg-indigo-600 hover:bg-indigo-700 text-white text-[11px] font-semibold px-3 py-1.5 rounded-lg transition shrink-0 cursor-pointer">Duyệt ngay</button>
                        </div>
                    `;
                });
            }

            let htmlContent = `
                <div class="w-full text-left space-y-4 max-h-[70vh] overflow-y-auto pr-1">
                    ${requestsHtml ? `<div><h4 class="font-bold text-xs text-amber-700 uppercase tracking-wider mb-2"><i class="fa-solid fa-triangle-exclamation mr-1"></i> Yêu cầu cấp quyền chờ duyệt</h4>${requestsHtml}</div>` : ''}
                    <div>
                        <h4 class="font-bold text-xs text-slate-500 uppercase tracking-wider mb-2">Nhật ký thay đổi theo thời gian thực</h4>
                        <div class="space-y-1">${activitiesHtml}</div>
                    </div>
                </div>
            `;

            showCustomModal("Thông Báo & Hoạt Động Thời Gian Thực", htmlContent, "fa-bell", `<button onclick="closeCustomModal()" class="bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-semibold px-4 py-2.5 rounded-xl transition w-full cursor-pointer">Đóng</button>`);
        }

        async function approveRequest(reqId) {
            const proj = projects.find(p => p.id === currentProjectId);
            if (!proj) return;
            const req = proj.requests.find(r => r.id === reqId);
            if (req) {
                proj.requests = proj.requests.filter(r => r.id !== reqId);
                logActivity(proj, `Đã phê duyệt quyền chỉnh sửa cho ${req.user}`);
                await saveData();
                closeCustomModal();
                showCustomModal("Thành công", `Đã phê duyệt yêu cầu cấp quyền cho ${req.user}!`, "fa-circle-check");
            }
        }

        async function requestNotificationPermission() {
            if ("Notification" in window) {
                const permission = await Notification.requestPermission();
                if (permission === "granted") {
                    showCustomModal("Thành công", "Bạn đã kích hoạt thông báo thành công!", "fa-circle-check");
                    checkTaskDeadlines();
                } else {
                    showCustomModal("Thông báo", "Bạn cần cấp quyền thông báo trên trình duyệt.", "fa-triangle-exclamation");
                }
            } else {
                showCustomModal("Thông báo", "Trình duyệt không hỗ trợ thông báo.", "fa-triangle-exclamation");
            }
        }

        function updateAppBadge(count) {
            if ('setAppBadge' in navigator) {
                try {
                    if (count > 0) navigator.setAppBadge(count);
                    else navigator.clearAppBadge();
                } catch (e) {}
            }
        }

        function getTodayDisplay() {
            const d = new Date();
            return `${String(d.getDate()).padStart(2, '0')}/${String(d.getMonth() + 1).padStart(2, '0')}/${d.getFullYear()}`;
        }

        function checkTaskDeadlines() {
            const todayStr = getTodayDisplay();
            let dueCount = 0;
            let dueDetails = [];

            projects.forEach(proj => {
                if (proj.tasks) {
                    proj.tasks.forEach(task => {
                        const st = task.status || 'Ver 1';
                        if (st === 'Final' || st === 'Chờ phản hồi') return;

                        if (task.deadline === todayStr) {
                            dueCount++;
                            dueDetails.push(`• [${proj.name}] ${task.name}`);
                        }
                    });
                }
            });

            if (dueCount > 0) {
                document.title = `(${dueCount}) 🔔 Có Deadline Hôm Nay!`;
                updateAppBadge(dueCount);

                if ("vibrate" in navigator) {
                    try { navigator.vibrate([200, 100, 200]); } catch (e) {}
                }

                if ("Notification" in window && Notification.permission === "granted") {
                    const key = "notified_" + todayStr;
                    if (!sessionStorage.getItem(key)) {
                        if (navigator.serviceWorker && navigator.serviceWorker.controller) {
                            navigator.serviceWorker.ready.then(registration => {

                                    icon: "./playstore.png",

                                    requireInteraction: true

                            new Notification(`⏰ Có ${dueCount} công việc đến hạn hôm nay!`, {
                                body: dueDetails.join("\n"),
                                icon: "./playstore.png",
                                badge: "./playstore.png",
                                tag: "deadline-notification",
                                requireInteraction: true
                            });

        window.initFirebaseData = async function() {
            if (!window.currentUser) return;
            
            document.getElementById('user-avatar').src = window.currentUser.photoURL || 'https://via.placeholder.com/150';
            document.getElementById('user-name').innerText = window.currentUser.displayName || window.currentUser.email;

            try {
                const userEmail = window.currentUser.email.trim().toLowerCase();
                const querySnapshot = await window.getDocs(window.collection(window.db, "projects"));
                
                projects = [];
                querySnapshot.forEach((docSnap) => {
                    const data = docSnap.data();
                    const owner = (data.ownerEmail || '').trim().toLowerCase();
                    
                    let memberEmails = [];
                    if (data.members) {
                        memberEmails = data.members.split(',').map(m => getEmailByNameOrInput(m).trim().toLowerCase());
                    }
                    
                    if (owner === userEmail || memberEmails.includes(userEmail)) {
                        projects.push({ id: docSnap.id, ...data });
                    }
                });

                currentProjectId = projects.length > 0 ? projects[0].id : null;
                renderApp();
            } catch (error) {
                console.error("Lỗi tải Firebase:", error);
            }
        };

        async function saveData() {
            const proj = projects.find(p => p.id === currentProjectId);
            if (proj) {
                try {
                    await window.setDoc(window.doc(window.db, "projects", String(proj.id)), proj);
                    checkTaskDeadlines();
                } catch (error) {
                    console.error("Lỗi lưu dữ liệu:", error);
                }
            }
        }

        async function addNewProject() {
            const newProj = {
                id: "proj_" + Date.now(),
                name: 'Dự án mới',
                ownerEmail: window.currentUser.email.trim().toLowerCase(),
                members: '',
                startDate: getTodayDisplay(),
                deadline: '31/12/2026',
                tasks: [],
                activities: [],
                requests: []
            };
            logActivity(newProj, 'Đã tạo dự án mới');
            projects.push(newProj);
            currentProjectId = newProj.id;
            await saveData();
            renderApp();
        }

        async function updateProjectInfo(field, value) {
            const proj = projects.find(p => p.id === currentProjectId);
            if (!proj) return;
            
            let role = getUserProjectRole(proj);
            if (role === 'viewer') {
                handleViewerAttemptEdit();
                renderMainContent();
                return;
            }

            if (field === 'members') {
                let items = value.split(',');
                items.forEach(item => {
                    let parsed = parseMemberInput(item.trim());
                    if (parsed.name && parsed.email) {
                        if (!memberRegistry[parsed.name]) {
                            memberRegistry[parsed.name] = { email: parsed.email, role: 'xem' };
                        }
                    }
                });
                saveMemberRegistry();
            }

            proj[field] = value;
            logActivity(proj, `Cập nhật thông tin dự án (${field})`);
            await saveData();
            renderProjectList();
            renderMainContent();
        }

        async function deleteProject(id, event) {
            event.stopPropagation();
            const proj = projects.find(p => p.id === id);
            const userEmail = window.currentUser.email.trim().toLowerCase();
            if (proj && proj.ownerEmail && proj.ownerEmail !== userEmail) {
                showCustomModal("Thông báo", "Chỉ người tạo ra dự án mới có quyền xóa dự án này!", "fa-triangle-exclamation");
                return;
            }

            let actions = `
                <div class="flex gap-2 w-full">
                    <button onclick="confirmDeleteProj('${id}')" class="flex-1 bg-red-600 hover:bg-red-700 text-white text-xs font-semibold py-2.5 rounded-xl transition cursor-pointer">Xóa</button>
                    <button onclick="closeCustomModal()" class="flex-1 bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-semibold py-2.5 rounded-xl transition cursor-pointer">Hủy</button>
                </div>
            `;
            showCustomModal("Xác nhận xóa", "Bạn có chắc muốn xóa vĩnh viễn dự án này trên Cloud?", "fa-trash-can", actions);
        }

        async function confirmDeleteProj(id) {
            try {
                await window.deleteDoc(window.doc(window.db, "projects", String(id)));
                projects = projects.filter(p => p.id !== id);
                currentProjectId = projects.length > 0 ? projects[0].id : null;
                closeCustomModal();
                renderApp();
            } catch (error) {
                console.error("Lỗi xóa dự án:", error);
            }
        }

        function switchTab(tabName) {
            currentTab = tabName;
            renderMainContent();
        }

        async function addNewTask() {
            const proj = projects.find(p => p.id === currentProjectId);
            if (!proj) return;

            let role = getUserProjectRole(proj);
            if (role === 'viewer') {
                handleViewerAttemptEdit();
                return;
            }

            const today = getTodayDisplay();
            if (!proj.tasks) proj.tasks = [];
            
            proj.tasks.push({
                id: Date.now(),
                name: 'Công việc mới',
                assignee: window.currentUser.email,
                startDate: today,
                deadline: today,
                urgency: 'Thấp',
                status: 'Ver 1',
                progressNote: '',
                cost: 0,
                links: [],
                issue: '',
                solution: ''
            });
            logActivity(proj, 'Thêm công việc mới');
            await saveData();
            renderMainContent();
        }

        async function updateTask(taskId, field, value) {
            const proj = projects.find(p => p.id === currentProjectId);
            if (!proj) return;

            let role = getUserProjectRole(proj);
            if (role === 'viewer') {
                handleViewerAttemptEdit();
                renderMainContent();
                return;
            }

            const task = proj.tasks.find(t => t.id === taskId);
            if (task) {
                if (field === 'assignee') {
                    task[field] = getEmailByNameOrInput(value);
                } else if (field === 'cost') {
                    task[field] = parseFloat(value) || 0;
                } else {
                    task[field] = value;
                }
                logActivity(proj, `Cập nhật công việc [${task.name}] (${field})`);
                await saveData();
            }
        }

        function handleDateInput(el, nextId, prevId) {
            let val = el.value.replace(/\D/g, '');
            let maxLen = parseInt(el.getAttribute('maxlength')) || 2;
            if (val.length > maxLen) val = val.slice(0, maxLen);
            el.value = val;
            if (val.length === maxLen && nextId) document.getElementById(nextId)?.focus();
            triggerAssembleDate(el);
        }

        function handleDateKeydown(e, prevId) {
            if (e.key === 'Backspace' && e.target.value.length === 0 && prevId) document.getElementById(prevId)?.focus();
        }

        function triggerAssembleDate(el) {
            const container = el.closest('.date-picker-group');
            if (!container) return;
            const d = container.querySelector('.d-input').value.padStart(2, '0');
            const m = container.querySelector('.m-input').value.padStart(2, '0');
            const y = container.querySelector('.y-input').value;
            const hiddenTarget = container.querySelector('.hidden-target');

            if (d.length === 2 && m.length === 2 && y.length === 4) {
                let fullDate = `${d}/${m}/${y}`;
                if (hiddenTarget.value !== fullDate) {
                    hiddenTarget.value = fullDate;
                    hiddenTarget.dispatchEvent(new Event('change'));
                }
            }
        }

        async function deleteTask(taskId) {
            const proj = projects.find(p => p.id === currentProjectId);
            if (!proj) return;

            let role = getUserProjectRole(proj);
            if (role === 'viewer') {
                handleViewerAttemptEdit();
                return;
            }

            proj.tasks = proj.tasks.filter(t => t.id !== taskId);
            logActivity(proj, 'Xóa một công việc');
            await saveData();
            renderMainContent();
        }

        async function addLinkToTask(taskId) {
            const proj = projects.find(p => p.id === currentProjectId);
            if (!proj) return;

            let role = getUserProjectRole(proj);
            if (role === 'viewer') {
                handleViewerAttemptEdit();
                return;
            }

            const task = proj.tasks.find(t => t.id === taskId);
            if (task) {
                if (!task.links) task.links = [];
                const title = prompt("Nhập tên hiển thị cho tài liệu/link:");
                if (!title || title.trim() === '') return;
                const url = prompt("Nhập đường dẫn (URL) của tài liệu/link:");
                if (url && url.trim() !== '') {
                    task.links.push({ id: Date.now(), title: title.trim(), url: url.trim() });
                    logActivity(proj, `Thêm tài liệu vào công việc [${task.name}]`);
                    await saveData();
                    renderMainContent();
                }
            }
        }

        async function removeLinkFromTask(taskId, linkId) {
            const proj = projects.find(p => p.id === currentProjectId);
            if (!proj) return;

            let role = getUserProjectRole(proj);
            if (role === 'viewer') {
                handleViewerAttemptEdit();
                return;
            }

            const task = proj.tasks.find(t => t.id === taskId);
            if (task && task.links) {
                task.links = task.links.filter(l => l.id !== linkId);
                logActivity(proj, `Xóa tài liệu của công việc [${task.name}]`);
                await saveData();
                renderMainContent();
            }
        }

        function exportProjectReport() { window.print(); }

        function renderCustomDateInput(dateStr, onChangeJsCode, uniquePrefix) {
            let parts = (dateStr || '').split('/');
            let d = parts[0] || '';
            let m = parts[1] || '';
            let y = parts[2] || '';

            return `
                <div class="date-picker-group inline-flex items-center bg-slate-50 border border-slate-200 rounded-lg px-2 py-1 shadow-sm">
                    <input type="text" value="${d}" placeholder="DD" maxlength="2" inputmode="numeric"
                        oninput="handleDateInput(this, 'm_${uniquePrefix}', null)" onkeydown="handleDateKeydown(event, null)"
                        class="d-input w-6 text-center bg-transparent focus:outline-none text-xs md:text-sm font-semibold text-slate-800">
                    <span class="text-slate-400 font-bold px-0.5">/</span>
                    <input type="text" value="${m}" placeholder="MM" maxlength="2" inputmode="numeric"
                        oninput="handleDateInput(this, 'y_${uniquePrefix}', 'd_${uniquePrefix}')" onkeydown="handleDateKeydown(event, 'd_${uniquePrefix}')"
                        class="m-input w-6 text-center bg-transparent focus:outline-none text-xs md:text-sm font-semibold text-slate-800">
                    <span class="text-slate-400 font-bold px-0.5">/</span>
                    <input type="text" value="${y}" placeholder="YYYY" maxlength="4" inputmode="numeric"
                        oninput="handleDateInput(this, null, 'm_${uniquePrefix}')" onkeydown="handleDateKeydown(event, 'm_${uniquePrefix}')"
                        class="y-input w-10 text-center bg-transparent focus:outline-none text-xs md:text-sm font-semibold text-slate-800">
                    
                    <input type="text" class="hidden-target hidden" value="${dateStr || ''}" onchange="${onChangeJsCode}">
                    
                    <div class="relative ml-1.5 pl-1.5 border-l border-slate-200">
                        <input type="date" onchange="const p = this.parentElement.parentElement; const t = p.querySelector('.hidden-target'); t.value = yyyyMmDdToDdMmYyyy(this.value); t.dispatchEvent(new Event('change'));" 
                            title="Bấm để chọn lịch" class="absolute opacity-0 w-full h-full cursor-pointer inset-0">
                        <i class="fa-regular fa-calendar text-indigo-600 text-xs"></i>
                    </div>
                </div>
            `;
        }

        function yyyyMmDdToDdMmYyyy(dateStr) {
            if (!dateStr) return '';
            if (dateStr.includes('-')) {
                const parts = dateStr.split('-');
                if (parts[0].length === 4) return `${parts[2]}/${parts[1]}/${parts[0]}`;
            }
            return dateStr;
        }

        function renderProjectList() {
            const listEl = document.getElementById('project-list');
            listEl.innerHTML = '';

            if (!projects || projects.length === 0) {
                listEl.innerHTML = `<div class="text-center py-6 text-slate-400 text-xs px-2">Chưa có dự án nào. Bấm nút <b>+</b> phía trên để tạo mới.</div>`;
                return;
            }

            const todayStr = getTodayDisplay();
            const userEmail = window.currentUser.email.trim().toLowerCase();

            projects.forEach(proj => {
                const isActive = proj.id === currentProjectId;
                let projDueCount = 0;
                if (proj.tasks) {
                    proj.tasks.forEach(t => { 
                        const st = t.status || 'Ver 1';
                        if (t.deadline === todayStr && st !== 'Final' && st !== 'Chờ phản hồi') projDueCount++; 
                    });
                }

                const badgeHtml = projDueCount > 0 ? `<span class="bg-red-500 text-white text-[9px] font-bold px-1.5 py-0.2 rounded-full ml-1 animate-bounce">${projDueCount}</span>` : '';

                const item = document.createElement('div');
                item.className = `group flex items-center justify-between p-2.5 md:p-3 rounded-xl cursor-pointer transition ${isActive ? 'bg-indigo-50 text-indigo-900 font-semibold shadow-sm' : 'hover:bg-slate-100 text-slate-600'}`;
                item.onclick = () => { currentProjectId = proj.id; renderApp(); };

                item.innerHTML = `
                    <div class="truncate flex-1 pr-2">
                        <div class="text-xs md:text-sm font-medium truncate flex items-center gap-1">
                            ${proj.name} ${badgeHtml}
                        </div>
                        <div class="text-[10px] md:text-[11px] text-slate-400 flex items-center gap-1 mt-0.5">
                            <i class="fa-regular fa-clock text-[9px]"></i> ĐT: ${proj.deadline || 'Chưa có'}
                        </div>
                    </div>
                    ${proj.ownerEmail && proj.ownerEmail.trim().toLowerCase() === userEmail ? `
                    <button onclick="deleteProject('${proj.id}', event)" class="opacity-0 group-hover:opacity-100 text-slate-400 hover:text-red-500 p-1 transition cursor-pointer" title="Xóa dự án">
                        <i class="fa-solid fa-trash-can text-xs"></i>
                    </button>` : ''}
                `;
                listEl.appendChild(item);
            });
        }

        function getAutocompleteDataList() {
            let uniqueNames = new Set();
            for (let name of Object.keys(memberRegistry)) uniqueNames.add(name);
            projects.forEach(p => {
                if (p.tasks) p.tasks.forEach(t => {
                    if (t.assignee) uniqueNames.add(getNameByEmail(t.assignee));
                });
            });
            let options = '';
            uniqueNames.forEach(n => {
                options += `<option value="${n}">`;
            });
            return `<datalist id="member-suggestions">${options}</datalist>`;
        }

        function renderMainContent() {
            const mainEl = document.getElementById('main-content');
            const proj = projects.find(p => p.id === currentProjectId);

            if (!proj) {
                mainEl.innerHTML = `<div class="flex-1 flex flex-col items-center justify-center text-slate-400 p-6 text-center"><i class="fa-solid fa-folder-open text-4xl mb-3"></i><p class="text-sm">Chưa có dự án nào. Bấm nút dấu cộng ở menu bên trái để tạo dự án mới.</p></div>`;
                return;
            }

            if (!proj.tasks) proj.tasks = [];
            let tabContentHtml = '';
            const todayStr = getTodayDisplay();
            const userEmail = window.currentUser.email.trim().toLowerCase();
            const role = getUserProjectRole(proj);
            const isViewer = role === 'viewer';

            let visibleTasks = proj.tasks;
            if (role === 'viewer') {
                visibleTasks = proj.tasks.filter(task => {
                    let taskAssigneeEmail = (getEmailByNameOrInput(task.assignee || '')).trim().toLowerCase();
                    return taskAssigneeEmail === userEmail;
                });
            }

            if (currentTab === 'tasks') {
                let filteredTasks = visibleTasks.filter(task => {
                    let assigneeName = getNameByEmail(task.assignee);
                    let matchKeyword = filterKeyword === '' || 
                        task.name.toLowerCase().includes(filterKeyword.toLowerCase()) || 
                        assigneeName.toLowerCase().includes(filterKeyword.toLowerCase());
                    
                    let matchUrgency = filterUrgency === 'all' || task.urgency === filterUrgency;
                    let matchDeadline = !filterDeadline || task.deadline === filterDeadline;

                    return matchKeyword && matchUrgency && matchDeadline;
                });

                if (taskViewMode === 'table') {
                    let tasksHtml = '';
                    if (filteredTasks.length === 0) {
                        tasksHtml = `<tr><td colspan="8" class="text-center py-8 text-slate-400 italic text-xs">Không có công việc nào phù hợp.</td></tr>`;
                    } else {
                        filteredTasks.forEach(task => {
                            let urgencyClass = 'bg-slate-100 text-slate-700';
                            if (task.urgency === 'Cao') urgencyClass = 'bg-red-100 text-red-700 font-semibold';
                            else if (task.urgency === 'Trung bình') urgencyClass = 'bg-amber-100 text-amber-700';
                            else if (task.urgency === 'Thấp') urgencyClass = 'bg-green-100 text-green-700';

                            let statusClass = 'bg-slate-100 text-slate-700';
                            const st = task.status || 'Ver 1';
                            if (st === 'Final') statusClass = 'bg-emerald-100 text-emerald-800 font-bold';
                            else if (st === 'Chờ phản hồi') statusClass = 'bg-amber-100 text-amber-800 font-bold';
                            else if (st.startsWith('Ver')) statusClass = 'bg-blue-50 text-blue-700';
                            else if (st === 'Chờ sản xuất') statusClass = 'bg-purple-100 text-purple-800';
                            else if (st === 'Pending') statusClass = 'bg-rose-100 text-rose-800';

                            let deadlineBadge = (task.deadline === todayStr && st !== 'Final' && st !== 'Chờ phản hồi') ? `<span class="ml-1 px-1.5 py-0.5 text-[9px] bg-amber-100 text-amber-700 rounded font-bold animate-pulse">Hôm nay 🔔</span>` : '';
                            let displayName = getNameByEmail(task.assignee);

                            let linksHtml = '';
                            if (task.links) {

                                    <td class="p-2 md:p-3 text-center"><button onclick="deleteTask(${task.id})" class="text-slate-400 hover:text-red-500"><i class="fa-solid fa-trash-can text-xs"></i></button></td>
                                </tr>
                            `;
                        });
                    }

                    tabContentHtml = `

                                    <option value="Thấp" ${filterUrgency==='Thấp'?'selected':''}>Ưu tiên: Thấp</option>
                                </select>
                                <input type="text" value="${filterDeadline}" onchange="filterDeadline=this.value; renderMainContent();" placeholder="Lọc deadline (DD/MM/YYYY)" class="bg-slate-50 border border-slate-200 rounded-xl px-3 py-1.5 text-xs text-slate-700 w-36 focus:outline-none">
                                ${filterDeadline ? `<button onclick="filterDeadline=''; renderMainContent();" class="text-xs text-red-500 underline font-medium">Bỏ lọc ngày</button>` : ''}
                            </div>
                            <div class="flex items-center gap-2">
                                <div class="bg-slate-100 p-1 rounded-xl flex items-center">
                                    <button onclick="taskViewMode='table'; renderMainContent();" class="px-3 py-1 rounded-lg text-xs font-semibold bg-white text-indigo-600 shadow-sm"><i class="fa-solid fa-table mr-1"></i> Bảng</button>
                                    <button onclick="taskViewMode='kanban'; renderMainContent();" class="px-3 py-1 rounded-lg text-xs font-semibold text-slate-600 hover:text-indigo-600"><i class="fa-solid fa-columns mr-1"></i> Kanban</button>
                                </div>
                                <button onclick="addNewTask()" class="bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-medium px-3.5 py-2 rounded-xl shadow-sm transition flex items-center gap-2 cursor-pointer"><i class="fa-solid fa-plus"></i> Thêm việc</button>
                            </div>
                        </div>
                        <div class="bg-white rounded-2xl border border-slate-200 shadow-sm overflow-x-auto">
                            <table class="w-full text-left border-collapse min-w-[950px]">
                                <thead><tr class="bg-slate-50 border-b border-slate-200 text-slate-500 text-xs uppercase tracking-wider"><th class="p-3">Tên công việc</th><th class="p-3">Phụ trách</th><th class="p-3">Deadline</th><th class="p-3">Ưu tiên</th><th class="p-3">Trạng thái</th><th class="p-3">Ghi chú</th><th class="p-3">Tài liệu</th><th class="p-3 text-center">Xóa</th></tr></thead>
                                <tbody>${tasksHtml}</tbody>
                            </table>
                        </div>
                    `;
                } else {
                    const statuses = ['Ver 1', 'Ver 2', 'Ver 3', 'Ver 4', 'Ver 5', 'Chờ phản hồi', 'Final', 'Chờ sản xuất', 'Pending'];
                    let columnsHtml = '';

                    statuses.forEach(st => {
                        let colTasks = filteredTasks.filter(t => (t.status || 'Ver 1') === st);
                        let cardsHtml = '';

                        colTasks.forEach(task => {
                            let urgencyBadge = task.urgency === 'Cao' ? `<span class="bg-red-100 text-red-700 text-[10px] font-bold px-1.5 py-0.5 rounded">Cao</span>` : '';
                            let displayName = getNameByEmail(task.assignee);

                            cardsHtml += `
                                <div class="bg-white p-3 rounded-xl border border-slate-200 shadow-sm space-y-2 hover:border-indigo-300 transition">
                                    <div class="font-medium text-slate-800 text-xs">${task.name}</div>
                                    <div class="flex items-center justify-between text-[11px] text-slate-500">
                                        <span><i class="fa-solid fa-user-tag mr-1"></i>${displayName}</span>
                                        ${urgencyBadge}
                                    </div>
                                    <div class="flex items-center justify-between pt-2 border-t border-slate-100 text-[11px]">
                                        <span class="text-indigo-600 font-medium"><i class="fa-regular fa-clock mr-1"></i>${task.deadline}</span>
                                        <select onchange="updateTask(${task.id}, 'status', this.value)" class="text-[10px] bg-slate-50 border border-slate-200 rounded px-1.5 py-1 text-slate-700 font-semibold">
                                            ${statuses.map(s => `<option value="${s}" ${s === st ? 'selected' : ''}>${s}</option>`).join('')}
                                        </select>
                                    </div>
                                </div>
                            `;
                        });

                        columnsHtml += `
                            <div class="w-72 shrink-0 bg-slate-100/70 rounded-2xl p-3 border border-slate-200 flex flex-col max-h-[calc(100vh-220px)]">
                                <div class="flex items-center justify-between mb-3 px-1">
                                    <span class="font-bold text-xs text-slate-700 uppercase tracking-wider">${st} (${colTasks.length})</span>
                                </div>
                                <div class="space-y-2 overflow-y-auto flex-1 pr-1">
                                    ${cardsHtml || '<div class="text-center py-6 text-slate-400 text-xs italic">Trống</div>'}
                                </div>
                            </div>
                        `;
                    });

                    tabContentHtml = `
                        ${getAutocompleteDataList()}
                        <div class="bg-white p-4 rounded-2xl border border-slate-200 shadow-sm mb-4 flex flex-wrap items-center justify-between gap-3">
                            <div class="flex flex-wrap items-center gap-2 flex-1">
                                <div class="relative flex-1 min-w-[200px]">
                                    <i class="fa-solid fa-magnifying-glass absolute left-3 top-2.5 text-slate-400 text-xs"></i>
                                    <input type="text" value="${filterKeyword}" oninput="filterKeyword=this.value;" onchange="renderMainContent();" placeholder="Tìm kiếm công việc..." class="w-full pl-8 pr-3 py-1.5 bg-slate-50 border border-slate-200 rounded-xl text-xs focus:outline-none focus:border-indigo-600">
                                </div>
                            </div>
                            <div class="flex items-center gap-2">
                                <div class="bg-slate-100 p-1 rounded-xl flex items-center">
                                    <button onclick="taskViewMode='table'; renderMainContent();" class="px-3 py-1 rounded-lg text-xs font-semibold text-slate-600 hover:text-indigo-600"><i class="fa-solid fa-table mr-1"></i> Bảng</button>
                                    <button onclick="taskViewMode='kanban'; renderMainContent();" class="px-3 py-1 rounded-lg text-xs font-semibold bg-white text-indigo-600 shadow-sm"><i class="fa-solid fa-columns mr-1"></i> Kanban</button>
                                </div>
                                <button onclick="addNewTask()" class="bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-medium px-3.5 py-2 rounded-xl shadow-sm transition flex items-center gap-2 cursor-pointer"><i class="fa-solid fa-plus"></i> Thêm việc</button>
                            </div>
                        </div>
                        <div class="flex gap-4 overflow-x-auto pb-4 items-start">
                            ${columnsHtml}
                        </div>
                    `;
                }
            } 
            else if (currentTab === 'gantt') {
                let ganttRows = '';
                visibleTasks.forEach((task, index) => {
                    ganttRows += `<div class="grid grid-cols-12 gap-2 items-center py-2.5 border-b border-slate-100 text-xs md:text-sm"><div class="col-span-4 font-medium text-slate-800 truncate">${index + 1}. ${task.name}</div><div class="col-span-2 text-xs text-slate-500">${getNameByEmail(task.assignee)}</div><div class="col-span-6"><div class="w-full bg-indigo-50 h-7 rounded-lg flex items-center px-3 text-indigo-900 text-xs font-semibold"><i class="fa-regular fa-calendar-days mr-2 text-indigo-600"></i> Deadline: ${task.deadline || 'Chưa cập nhật'}</div></div></div>`;
                });
                tabContentHtml = `<div class="mb-4"><h2 class="font-bold text-base md:text-lg text-slate-800">Biểu Đồ Tiến Độ</h2></div><div class="bg-white rounded-2xl border border-slate-200 shadow-sm p-4 overflow-x-auto"><div class="min-w-[650px] space-y-2">${ganttRows || '<p class="text-xs text-slate-400">Không có công việc nào.</p>'}</div></div>`;
            }
            else if (currentTab === 'costs') {
                let totalCost = 0;
                let costRows = '';
                visibleTasks.forEach(t => {
                    totalCost += Number(t.cost) || 0;
                    costRows += `<tr class="border-b border-slate-100 text-xs md:text-sm"><td class="p-3">${t.name}</td><td class="p-3">${getNameByEmail(t.assignee)}</td><td class="p-3"><input type="number" value="${t.cost || 0}" onchange="updateTask(${t.id}, 'cost', this.value)" class="w-32 bg-slate-50 px-2 py-1 rounded border text-indigo-600 font-semibold"> VNĐ</td></tr>`;
                });
                tabContentHtml = `<div class="mb-6"><h2 class="font-bold text-base md:text-lg text-slate-800">Quản Lý Chi Phí</h2></div><div class="bg-indigo-600 text-white p-5 rounded-2xl shadow-sm mb-6"><div class="text-xs uppercase opacity-80">Tổng chi phí</div><div class="text-2xl font-bold mt-2">${totalCost.toLocaleString('vi-VN')} VNĐ</div></div><div class="bg-white rounded-2xl border border-slate-200 shadow-sm overflow-x-auto"><table class="w-full text-left border-collapse min-w-[500px]"><thead><tr class="bg-slate-50 border-b text-xs uppercase text-slate-500"><th class="p-3">Công việc</th><th class="p-3">Phụ trách</th><th class="p-3">Chi phí</th></tr></thead><tbody>${costRows}</tbody></table></div>`;
            }
            else if (currentTab === 'risks') {
                let riskRows = '';
                visibleTasks.forEach(task => {
                    riskRows += `<tr class="border-b border-slate-100 align-top text-xs md:text-sm"><td class="p-3 font-medium">${task.name}</td><td class="p-3 space-y-2"><div><label class="block text-[10px] font-semibold text-amber-600 uppercase mb-1">Rủi ro:</label><textarea rows="2" onchange="updateTask(${task.id}, 'issue', this.value)" class="w-full bg-amber-50/50 p-2 rounded border border-amber-200 text-xs">${task.issue || ''}</textarea></div><div><label class="block text-[10px] font-semibold text-emerald-600 uppercase mb-1">Giải pháp:</label><textarea rows="2" onchange="updateTask(${task.id}, 'solution', this.value)" class="w-full bg-emerald-50/50 p-2 rounded border border-emerald-200 text-xs">${task.solution || ''}</textarea></div></td></tr>`;
                });
                tabContentHtml = `<div class="mb-4"><h2 class="font-bold text-base md:text-lg text-slate-800">Rủi Ro & Giải Pháp</h2></div><div class="bg-white rounded-2xl border border-slate-200 shadow-sm overflow-x-auto"><table class="w-full text-left border-collapse min-w-[550px]"><thead><tr class="bg-slate-50 border-b text-xs uppercase text-slate-500"><th class="p-3">Công việc</th><th class="p-3">Nội dung</th></tr></thead><tbody>${riskRows}</tbody></table></div>`;
            }
            else if (currentTab === 'directory') {
                let filteredRegistry = Object.entries(memberRegistry).filter(([name, data]) => {
                    let kw = memberSearchKeyword.toLowerCase();
                    return name.toLowerCase().includes(kw) || data.email.toLowerCase().includes(kw);
                });

                let registryRows = '';
                if (filteredRegistry.length === 0) {
                    registryRows = `<tr><td colspan="4" class="text-center py-6 text-slate-400 italic text-xs">Chưa có thành viên nào trong sổ danh bạ hoặc không tìm thấy kết quả.</td></tr>`;
                } else {
                    filteredRegistry.forEach(([name, data]) => {
                        let roleSelect = `
                            <select onchange="updateRegistryMemberRole('${name}', this.value)" class="text-xs px-2 py-1 rounded-lg border border-slate-200 font-semibold ${data.role === 'chinhsua' ? 'bg-emerald-50 text-emerald-700' : 'bg-slate-100 text-slate-700'}">
                                <option value="xem" ${data.role === 'xem' ? 'selected' : ''}>👁️ Xem</option>
                                <option value="chinhsua" ${data.role === 'chinhsua' ? 'selected' : ''}>✏️ Chỉnh sửa</option>
                            </select>
                        `;

                        registryRows += `
                            <tr class="border-b border-slate-100 text-xs md:text-sm hover:bg-slate-50">
                                <td class="p-3 font-semibold text-indigo-700">${name}</td>
                                <td class="p-3 text-slate-600">${data.email}</td>
                                <td class="p-3">${roleSelect}</td>
                                <td class="p-3 text-center">
                                    <button onclick="deleteMemberRegistry('${name}')" class="text-slate-400 hover:text-red-500 p-1 transition cursor-pointer" title="Xóa thành viên">
                                        <i class="fa-solid fa-trash-can text-xs"></i>
                                    </button>
                                </td>
                            </tr>
                        `;
                    });
                }

                tabContentHtml = `
                    <div class="mb-4 flex flex-col sm:flex-row items-start sm:items-center justify-between gap-3">
                        <div>
                            <h2 class="font-bold text-base md:text-lg text-slate-800">Danh Sách Thành Viên & Phân Quyền</h2>
                            <p class="text-xs text-slate-500">Chủ dự án có thể thêm hàng loạt và phân quyền nhanh chóng tại đây.</p>
                        </div>
                        <button onclick="addNewMemberFromPrompt()" class="bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-medium px-3.5 py-2 rounded-xl shadow-sm transition flex items-center gap-2 cursor-pointer">
                            <i class="fa-solid fa-user-plus"></i> Thêm thành viên hàng loạt
                        </button>
                    </div>

                    <div class="bg-white p-4 rounded-2xl border border-slate-200 shadow-sm mb-4">
                        <div class="relative max-w-md">
                            <i class="fa-solid fa-magnifying-glass absolute left-3 top-2.5 text-slate-400 text-xs"></i>
                            <input type="text" value="${memberSearchKeyword}" oninput="memberSearchKeyword=this.value; renderMainContent();" placeholder="Tra cứu theo tên hoặc email thành viên..." class="w-full pl-8 pr-3 py-1.5 bg-slate-50 border border-slate-200 rounded-xl text-xs focus:outline-none focus:border-indigo-600">
                        </div>
                    </div>

                    <div class="bg-white rounded-2xl border border-slate-200 shadow-sm overflow-x-auto">
                        <table class="w-full text-left border-collapse min-w-[500px]">
                            <thead>
                                <tr class="bg-slate-50 border-b border-slate-200 text-slate-500 text-xs uppercase tracking-wider">
                                    <th class="p-3">Tên hiển thị</th>
                                    <th class="p-3">Địa chỉ Email</th>
                                    <th class="p-3">Phân quyền vai trò</th>
                                    <th class="p-3 text-center">Xóa</th>
                                </tr>
                            </thead>
                            <tbody>${registryRows}</tbody>
                        </table>
                    </div>
                `;
            }

            let startInput = renderCustomDateInput(proj.startDate, `updateProjectInfo('startDate', this.value)`, `proj_start_${proj.id}`);
            let deadlineInput = renderCustomDateInput(proj.deadline, `updateProjectInfo('deadline', this.value)`, `proj_deadline_${proj.id}`);

            let reqCount = (proj.requests && proj.requests.length > 0) ? proj.requests.length : 0;
            let bellBadgeHtml = reqCount > 0 ? `<span class="absolute -top-1 -right-1 bg-red-500 text-white text-[9px] font-bold w-4 h-4 rounded-full flex items-center justify-center animate-bounce">${reqCount}</span>` : '';

            mainEl.innerHTML = `
                ${getAutocompleteDataList()}
                <div class="bg-white border-b border-slate-200 p-4 md:p-6 shadow-sm">
                    <div class="max-w-7xl mx-auto">
                        <div class="flex flex-col sm:flex-row items-start sm:items-center justify-between gap-4 mb-4">
                            <div class="flex-1 w-full pr-2 relative">
                                <label class="text-[11px] font-semibold text-slate-400 uppercase">Tên dự án</label>
                                <input type="text" value="${proj.name}" onchange="updateProjectInfo('name', this.value)" class="w-full text-xl md:text-2xl font-bold text-slate-900 bg-transparent border-b border-transparent hover:border-slate-300 focus:border-indigo-600 focus:outline-none py-1">
                            </div>
                            <div class="flex items-center gap-2">
                                <button onclick="openActivityLogModal()" class="relative bg-slate-100 hover:bg-slate-200 text-slate-700 w-10 h-10 rounded-xl shadow-sm transition flex items-center justify-center cursor-pointer" title="Nhật ký thay đổi & Yêu cầu cấp quyền">
                                    <i class="fa-solid fa-bell text-sm"></i>
                                    ${bellBadgeHtml}
                                </button>
                                <button onclick="exportProjectReport()" class="bg-emerald-600 hover:bg-emerald-700 text-white text-sm font-medium px-4 py-2.5 rounded-xl shadow-sm transition flex items-center gap-2 cursor-pointer"><i class="fa-solid fa-file-arrow-down"></i> Xuất Báo Cáo</button>
                            </div>
                        </div>
                        <div class="grid grid-cols-1 sm:grid-cols-3 gap-3 md:gap-4 mb-2">
                            <div><label class="text-[11px] font-semibold text-slate-400 uppercase flex items-center gap-1 mb-1"><i class="fa-solid fa-users"></i> Thành viên hiển thị</label><input type="text" value="${proj.members || ''}" list="member-suggestions" onchange="updateProjectInfo('members', this.value)" placeholder="VD: Hoàng (prodoggy2@gmail.com), Hà" class="w-full text-xs md:text-sm text-slate-700 bg-slate-50 px-3 py-2 rounded-lg border border-slate-200"></div>
                            <div><label class="text-[11px] font-semibold text-slate-400 uppercase flex items-center gap-1 mb-1"><i class="fa-solid fa-calendar-days"></i> Ngày bắt đầu</label>${startInput}</div>
                            <div><label class="text-[11px] font-semibold text-slate-400 uppercase flex items-center gap-1 mb-1"><i class="fa-solid fa-calendar-days"></i> Deadline tổng</label>${deadlineInput}</div>
                        </div>
                        <div class="flex items-center gap-2 mt-4 border-b border-slate-100 pb-2 overflow-x-auto">
                            <button onclick="switchTab('tasks')" class="px-3.5 py-2 rounded-xl text-xs md:text-sm font-semibold transition cursor-pointer whitespace-nowrap ${currentTab === 'tasks' ? 'bg-indigo-600 text-white shadow-sm' : 'text-slate-600 hover:bg-slate-100'}"><i class="fa-solid fa-list-check mr-1.5"></i> Công việc</button>
                            <button onclick="switchTab('gantt')" class="px-3.5 py-2 rounded-xl text-xs md:text-sm font-semibold transition cursor-pointer whitespace-nowrap ${currentTab === 'gantt' ? 'bg-indigo-600 text-white shadow-sm' : 'text-slate-600 hover:text-indigo-600'}"><i class="fa-solid fa-chart-gantt mr-1.5"></i> Gantt Chart</button>
                            <button onclick="switchTab('costs')" class="px-3.5 py-2 rounded-xl text-xs md:text-sm font-semibold transition cursor-pointer whitespace-nowrap ${currentTab === 'costs' ? 'bg-indigo-600 text-white shadow-sm' : 'text-slate-600 hover:text-slate-100'}"><i class="fa-solid fa-wallet mr-1.5"></i> Chi phí</button>
                            <button onclick="switchTab('risks')" class="px-3.5 py-2 rounded-xl text-xs md:text-sm font-semibold transition cursor-pointer whitespace-nowrap ${currentTab === 'risks' ? 'bg-indigo-600 text-white shadow-sm' : 'text-slate-600 hover:text-slate-100'}"><i class="fa-solid fa-triangle-exclamation mr-1.5"></i> Rủi ro</button>
                            <button onclick="switchTab('directory')" class="px-3.5 py-2 rounded-xl text-xs md:text-sm font-semibold transition cursor-pointer whitespace-nowrap ${currentTab === 'directory' ? 'bg-indigo-600 text-white shadow-sm' : 'text-slate-600 hover:text-slate-100'}"><i class="fa-solid id-card mr-1.5"></i> Sổ Danh Bạ Thành Viên</button>
                        </div>
                    </div>
                </div>
                <div class="p-4 md:p-6 max-w-7xl mx-auto w-full flex-1">${tabContentHtml}</div>
            `;
        }

        function renderApp() {
            renderProjectList();
            renderMainContent();
            checkTaskDeadlines();
        }
    </script>
</body>
</html>
